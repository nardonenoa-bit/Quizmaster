<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Trail Noa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f7f7f8; --card:#fff; --ink:#1f2328; --ink2:#3d434b; --muted:#6b7280; --line:#e9e9ec; --line2:#f1f1f3;
  --orange:#FC4C02; --orange-d:#d93f00; --orange-s:#fff1ea; --green:#16a34a; --blue:#2563eb; --red:#dc2626; --amber:#d97706;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--orange)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px}
.brand .sp{flex:1}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block}
.dot.ok{background:var(--green)} .dot.live{background:var(--orange);box-shadow:0 0 0 3px rgba(252,76,2,.18)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--orange);border-bottom-color:var(--orange)}

main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:560px){.brand .sub{display:none}.sync .lbl{display:none}}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:auto}}
@media (max-width:680px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.card h3{font-size:13px;margin:14px 0 8px;font-weight:700;color:var(--ink2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2)}
.pill.o{background:var(--orange-s);color:var(--orange-d)}
.pill.g{background:#e8f7ee;color:#11733a}
.pill.r{background:#fdecec;color:#b42318}
.pill.a{background:#fef3e2;color:#a45a06}

.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d4d4d8}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{background:var(--orange-d)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

/* KPI + countdown */
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--orange)}
.cd{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#FC4C02,#ff7a3d)}
.cd.blue{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.cd .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cd .lab{opacity:.9;font-weight:600;font-size:12.5px}
.cd .ev{font-size:16px;font-weight:700;margin-top:8px}
.cd .meta{font-size:12.5px;opacity:.92;margin-top:2px}
.cd svg.mnt{position:absolute;right:-6px;bottom:-4px;opacity:.18}

/* Week circles */
.circles{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.circ{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px}
.circ .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:3px solid;background:#fff}
.circ.today .c{box-shadow:0 0 0 4px rgba(252,76,2,.2)}
.circ .d{font-weight:700;color:var(--ink2)}
@media (max-width:420px){.circ .c{width:36px;height:36px;font-size:11px}}

.coach{background:var(--orange-s);border-left:4px solid var(--orange);border-radius:10px;padding:12px 14px;font-size:14px;color:#5a2a10}

/* Feed */
.feed{display:flex;flex-direction:column}
.act{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line2);align-items:center}
.act:first-child{border-top:0}
.act .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.act .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .st{display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.act .st b{color:var(--ink);font-weight:600}

/* Shoes */
.shoe{padding:10px 0;border-top:1px solid var(--line2)}
.shoe:first-child{border-top:0}
.shoe .bar{margin-top:6px}

/* Plan */
.wkhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wkhead .tt{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:18px;font-weight:700}
.sess{display:grid;grid-template-columns:62px 118px minmax(0,1fr) 92px 92px 34px;gap:10px;align-items:center;padding:11px 10px;border-radius:12px;border:1px solid var(--line2);background:#fff;margin-top:8px}
.sess.done{background:#fbfdfb}
.sess.today{border-color:var(--orange);box-shadow:0 0 0 3px rgba(252,76,2,.08)}
.sess .day b{display:block;font-size:14px}
.sess .day span{font-size:12px;color:var(--muted)}
.sess .ttl{font-weight:600}
.sess .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.sess .note{font-size:12.5px;color:var(--ink2);margin-top:3px}
.sess .k{text-align:right}
.sess .k b{display:block;font-size:15px}
.sess .k span{font-size:11.5px;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #d4d4d8;display:grid;place-items:center;cursor:pointer;background:#fff;padding:0}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.sess.drag{opacity:.4}
.sess.over{border-color:var(--orange);border-style:dashed}
.handle{cursor:grab;color:#9ca3af;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.sess input,.sess select,.sess textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff;font-size:13px}
.sess textarea{resize:vertical;min-height:34px}
.sess.edit{grid-template-columns:24px 56px 118px minmax(0,1fr) 150px 150px 34px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mini label{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
@media (max-width:820px){
  .sess{grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 30px;grid-template-areas:"d t t c" "d y y y" "d k r r";row-gap:6px}
  .sess .day{grid-area:d;align-self:start} .sess .typ{grid-area:y} .sess .body{grid-area:t} .sess .chkw{grid-area:c;align-self:start}
  .sess .kp{grid-area:k;text-align:left} .sess .kr{grid-area:r;text-align:left}
  .sess.edit{grid-template-columns:minmax(0,1fr);grid-template-areas:none}
  .sess.edit>*{grid-area:auto !important}
}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 92px;gap:4px}
.cal .h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 6px}
.cell{min-height:86px;border-radius:10px;background:#fff;border:1px solid var(--line2);padding:6px;display:flex;flex-direction:column;gap:4px;font-size:12px;cursor:pointer}
.cell.out{opacity:.38}
.cell.today{border-color:var(--orange);box-shadow:0 0 0 2px rgba(252,76,2,.15)}
.cell .dn{font-weight:700;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between}
.cell .tb{border-radius:6px;padding:2px 6px;font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .rk{font-size:11.5px;color:var(--muted)}
.cell.race{background:linear-gradient(180deg,#fff4ee,#fff)}
.wtot{border-radius:10px;background:var(--line2);padding:6px 8px;font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.wtot b{font-size:13px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:760px){
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .wtot{grid-column:1/-1;flex-direction:row;gap:12px;justify-content:flex-start;padding:4px 8px}
  .cell{min-height:58px;padding:4px}
  .cell .tb{font-size:10px;padding:1px 3px}
  .cell .rk{display:none}
}

/* Tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* Charts */
.chart{width:100%;height:auto;display:block}
.tip{position:fixed;z-index:50;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .08s;max-width:240px}
.tip b{font-weight:700}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Zones */
.zrow{display:grid;grid-template-columns:44px 130px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:7px 0}
.zbar{height:24px;border-radius:7px;display:flex;align-items:center;padding:0 8px;color:#fff;font-weight:700;font-size:12px}
@media (max-width:560px){.zrow{grid-template-columns:40px minmax(0,1fr) 80px}.zrow .zl{display:none}}

/* Chat */
.chat{display:flex;flex-direction:column;height:min(72vh,760px)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--line2);border-bottom-left-radius:4px}
.msg.a h4{margin:6px 0 2px;font-size:14px}
.msg .tools{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.msg.err{background:#fdecec;color:#b42318}
.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.compose textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;min-height:46px;max-height:160px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.inp{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;width:100%}

.drop{border:2px dashed #d4d4d8;border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--orange);color:var(--orange)}
.warn{background:#fef3e2;border-radius:10px;padding:10px 12px;color:#7a4306;font-size:13px}
.info{background:#eef4ff;border-radius:10px;padding:10px 12px;color:#1e3a8a;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hide{display:none !important}
input[type=range]{accent-color:var(--orange);width:100%}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 19 9.5 8l3.5 6 2.5-4L21 19z" fill="#fff"/></svg>

</header>
<main id="app"></main>
<div class="tip" id="tip"></div>
<input type="file" id="gpxIn" accept=".gpx,application/gpx+xml,application/xml,text/xml" class="hide">

  utbv:{name:'Ultra Trail du Beaujolais Vert',short:'UTBV',date:'2026-10-10',km:42.53,dplus:2173,dminus:2173,altmin:317,altmax:827,loc:'Cublize, Beaujolais',

  saintelyon:{name:'Sainté-Lyon',short:'Sainté-Lyon',date:'2026-11-28',start:'23h30',km:80,dplus:2200,prediction:'10h30 — 12h00',

};

const UTBV_SECTIONS = [
  {from:0,to:5,up:203,down:89,note:'Mise en route. FC < 150.',pace:'7:30',fc:'< 150'},

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS_L = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const pd = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ymd = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today0 = ()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const daysBetween = (a,b)=>Math.round((b-a)/864e5);
function weekStart(w){const j4=new Date(2026,0,4);const mon1=addDays(j4,-((j4.getDay()+6)%7));return addDays(mon1,(w-1)*7)}
function isoWeek(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
const fmtKm = (k,dp=1)=>(Math.round(k*10**dp)/10**dp).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:dp});
const fmtInt = n=>Math.round(n).toLocaleString('fr-FR');
function fmtPace(sPerKm){if(!isFinite(sPerKm)||sPerKm<=0)return '—';let m=Math.floor(sPerKm/60),s=Math.round(sPerKm-m*60);if(s===60){m++;s=0}return `${m}:${String(s).padStart(2,'0')}`}
function parsePace(p){const m=String(p).match(/(\d+):(\d{2})/);return m?(+m[1])*60+(+m[2]):NaN}
function fmtDur(sec,withSec=false){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return withSec?`${h}h${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${h}h${String(m).padStart(2,'0')}`;
  return withSec?`${m}:${String(s).padStart(2,'0')}`:`${m} min`}
function fmtDateFr(d,opt={}){const x=typeof d==='string'?pd(d):d;return `${opt.day?DAYS_L[(x.getDay()+6)%7].toLowerCase()+' ':''}${x.getDate()} ${MONTHS[x.getMonth()]}`}
const typeBadge = (t,extra='')=>{const T=TYPES[t]||TYPES.EF;return `<span class="badge" style="background:${T.color}1a;color:${shade(T.color)}">${extra}${T.label}</span>`};
function shade(hex){/* version foncée lisible pour le texte */const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=hex==='#93c5fd'||hex==='#9ca3af'?.55:.82;return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`}
const round5 = x=>Math.round(x*2)/2;
const round10 = x=>Math.round(x/10)*10;

/* Stockage : window.storage (artefact Claude) sinon localStorage */
const store = {
  async get(k){
    try{ if(window.storage&&typeof window.storage.get==='function'){const r=await window.storage.get(k);if(r&&r.value!=null)return JSON.parse(r.value);return null} }catch(e){}
    try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}
  },
  async set(k,v){
    const s=JSON.stringify(v);
    try{ if(window.storage&&typeof window.storage.set==='function'){await window.storage.set(k,s);return} }catch(e){}
    try{localStorage.setItem(k,s)}catch(e){}
  }
};
const local = {get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};

function activities(){

/* =========================================================

   ========================================================= */
const INT_CYCLE = {
  FRAC:{type:'FRAC',title:'Frac 5 x 1 km',note:'Récup 2:30. On Cloudflow.'},
  COTES:{type:'COTES',title:'Côtes 10 x 1 min',note:'Récup descente trottinée. Gainage après.'},
  TEMPO:{type:'TEMPO',title:'Tempo 3 x 10 min AS21',note:'Récup 3 min. Allure semi, pas plus.'}
};
function template(wk){
  if(wk.tpl==='recup') return [
    {type:'REPOS',title:'Repos',f:0,fd:0,note:'Récup post-course'},
    {type:'RECUP',title:'Footing sans montre',f:.2,fd:.15,note:'Si les quadriceps le permettent'},
    {type:'REPOS',title:'Repos',f:0,fd:0,note:''},
    {type:'EF',title:'EF souple',f:.25,fd:.25,note:'Vélo possible à la place'},
    {type:'REPOS',title:'Repos',f:0,fd:0,note:''},
    {type:'EF',title:'EF trail souple',f:.35,fd:.45,note:'Plaisir, sans objectif'},
    {type:'RECUP',title:'Footing',f:.2,fd:.15,note:''}];
  const ic = ['FRAC','COTES','TEMPO'][(wk.w-35)%3];
  const I = INT_CYCLE[ic];
  const night = wk.night ? ' de nuit' : '';
  return [
    {type:'EF',title:'EF souple',f:.12,fd:.08,note:'Allure conversation'},
    {type:I.type,title:I.title,f:.16,fd:.12,note:I.note},
    {type:wk.phase==='Affûtage'?'REPOS':'CROSS',title:wk.phase==='Affûtage'?'Repos':'Repos ou vélo souple',f:0,fd:0,note:wk.phase==='Affûtage'?'':'45 min max en Z1, optionnel'},
    {type:'EF',title:'EF trail vallonné',f:.2,fd:.25,note:'Marche active dans les pentes > 15 %'},
    {type:'RECUP',title:'Récup / activation',f:.1,fd:.05,note:'Footing + 4 lignes droites'},
    {type:'SL',title:'Sortie longue trail'+night,f:.32,fd:.4,note:wk.night?'Frontale, couches chaudes, nutrition solide après 2 h.':'Séance clé. Un gel toutes les 40 min.'},
    {type:'EF',title:'Décrassage',f:.1,fd:.1,note:'Très souple'}];
}
function basePlan(wk){
  if(wk.detail) return wk.detail.map(s=>({type:s.type,title:s.title,km:s.km,dplus:s.dplus,bpm:s.bpm||TYPE_DEF[s.type].bpm,pace:s.pace||TYPE_DEF[s.type].pace,note:s.note||''}));
  const tpl = template(wk);
  let kmLeft = wk.km, dLeft = wk.d, fSum = 1, fdSum = 1;
  if(wk.race){kmLeft -= wk.race.km; dLeft -= wk.race.dplus; fSum -= tpl[wk.race.day].f; fdSum -= tpl[wk.race.day].fd}
  const out = tpl.map((t,i)=>{
    if(wk.race && i===wk.race.day){const r=wk.race;return {type:r.type,title:r.title,km:r.km,dplus:r.dplus,bpm:r.bpm,pace:r.pace,note:r.note}}
    const km = t.f? round5(Math.max(0,kmLeft*t.f/fSum)) : 0;
    const dp = t.fd? round10(Math.max(0,dLeft*t.fd/fdSum)) : 0;
    return {type:t.type,title:t.title,km,dplus:dp,bpm:TYPE_DEF[t.type].bpm,pace:TYPE_DEF[t.type].pace,note:t.note};
  });
  /* Le reste d'arrondi va sur la plus grosse séance hors course : totaux = plan hebdo */
  const free=out.map((x,i)=>i).filter(i=>!(wk.race&&i===wk.race.day));
  const big=free.reduce((b,i)=>out[i].km>out[b].km?i:b,free[0]);
  out[big].km=+(out[big].km+wk.km-out.reduce((a,x)=>a+x.km,0)).toFixed(1);
  out[big].dplus=Math.max(0,out[big].dplus+wk.d-out.reduce((a,x)=>a+x.dplus,0));
  return out;
}
function getWeek(w){
  const wk = WEEKS.find(x=>x.w===w);
  const ed = S.edits[w];
  const plan = ed&&ed.plan ? ed.plan : basePlan(wk);
  const start = weekStart(w);
  const byDate = actsByDate();
  const t0 = today0();
  const sessions = plan.map((p,i)=>{
    const date = addDays(start,i);
    const ds = ymd(date);
    const acts = (byDate[ds]||[]);
    const runs = acts.filter(a=>a.type==='Run');
    const sk = runs.reduce((s,a)=>s+a.km,0), sd = runs.reduce((s,a)=>s+a.dplus,0);
    const ov = ed&&ed.days&&ed.days[i] || {};
    const ak = ov.ak!=null ? ov.ak : sk;
    const ad = ov.ad!=null ? ov.ad : sd;
    const past = date < t0;
    const done = ov.done!=null ? ov.done : (ak>0 || (past && p.type==='REPOS'));
    return {...p,i,date,ds,acts,ak,ad,done,past,isToday:+date===+t0,manual:ov.ak!=null||ov.ad!=null};
  });
  const pk = sessions.reduce((s,x)=>s+(+x.km||0),0), pdp = sessions.reduce((s,x)=>s+(+x.dplus||0),0);
  const rk = sessions.reduce((s,x)=>s+(+x.ak||0),0), rd = sessions.reduce((s,x)=>s+(+x.ad||0),0);
  const foot = sessions.flatMap(s=>s.acts.filter(a=>a.type==='Foot'));
  const ride = sessions.flatMap(s=>s.acts.filter(a=>a.type==='Ride'));
  const end = addDays(start,6);
  const status = t0>end ? 'past' : t0<start ? 'future' : 'current';
  return {...wk,start,end,sessions,pk,pd:pdp,rk,rd,foot,ride,status,edited:!!ed};
}
function sessionOn(date){const w=isoWeek(date);if(w<35||w>48)return null;return getWeek(w).sessions[(date.getDay()+6)%7]}
function currentWeekNum(){const w=isoWeek(today0());return Math.min(48,Math.max(35,w))}
function ensureEdit(w){
  if(!S.edits[w]) S.edits[w]={plan:basePlan(WEEKS.find(x=>x.w===w)).map(x=>({...x})),days:{}};
  if(!S.edits[w].plan) S.edits[w].plan=basePlan(WEEKS.find(x=>x.w===w)).map(x=>({...x}));
  if(!S.edits[w].days) S.edits[w].days={};
  return S.edits[w];
}

/* =========================================================

function barChart({weeks,keyP,keyR,unit,height=220,fmt=v=>fmtInt(v)}){
  const W=640,H=height,pl=38,pr=8,pt=12,pb=26;
  const max = Math.max(10,...weeks.map(w=>Math.max(w[keyP],w[keyR])))*1.1;
  const nice = niceStep(max/4); const top = Math.ceil(max/nice)*nice;
  const iw=(W-pl-pr)/weeks.length, bw=Math.min(16,iw*.32);
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-6;v+=nice){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f2"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#9aa1ab">${fmtInt(v)}</text>`}
  weeks.forEach((w,i)=>{
    const cx=pl+iw*i+iw/2;
    const cur = w.status==='current';
    if(cur) g+=`<rect x="${pl+iw*i+1}" y="${pt}" width="${iw-2}" height="${H-pt-pb}" fill="#FC4C02" opacity=".06" rx="6"/>`;
    g+=`<rect x="${cx-bw-1}" y="${y(w[keyP])}" width="${bw}" height="${Math.max(0,y(0)-y(w[keyP]))}" rx="3" fill="#e4e6ea"/>`;
    if(w.status!=='future') g+=`<rect x="${cx+1}" y="${y(w[keyR])}" width="${bw}" height="${Math.max(0,y(0)-y(w[keyR]))}" rx="3" fill="${w.block==='B'?'#2563eb':'#FC4C02'}"/>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10.5" font-weight="${cur?700:500}" fill="${cur?'#FC4C02':'#6b7280'}">S${w.w}</text>`;
    g+=`<rect x="${pl+iw*i}" y="${pt}" width="${iw}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(`<b>S${w.w} · ${w.phase}</b><br>Planifié : ${fmt(w[keyP])} ${unit}<br>Réalisé : ${w.status==='future'?'—':fmt(w[keyR])+' '+unit}`)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function niceStep(x){const p=10**Math.floor(Math.log10(x));const n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function bindTips(root=document){
  $$('[data-tip]',root).forEach(el=>{
    el.addEventListener('mousemove',e=>showTip(el.getAttribute('data-tip'),e.clientX,e.clientY));
    el.addEventListener('mouseleave',hideTip);
    el.addEventListener('touchstart',e=>{const t=e.touches[0];showTip(el.getAttribute('data-tip'),t.clientX,t.clientY);setTimeout(hideTip,1800)},{passive:true});
  });
}

function renderDash(){
  const t0=today0();
  const cw = currentWeekNum();
  const weeks = WEEKS.map(w=>getWeek(w.w));
  const cur = weeks.find(w=>w.w===cw);
  const past = weeks.filter(w=>w.status!=='future');
  const last4 = past.slice(-4);
  const avg4 = last4.reduce((s,w)=>s+w.rk,0)/Math.max(1,last4.length);
  const countdown = (id,cls)=>{const r=RACES[id];const d=daysBetween(t0,pd(r.date));
    return `<div class="card cd ${cls}">
      <svg class="mnt" width="180" height="110" viewBox="0 0 180 110"><path d="M0 110 50 30l30 40 25-30 75 70z" fill="#fff"/></svg>
      <div class="lab">${d>0?'Compte à rebours':d===0?'Jour J':'Terminé'}</div>
      <div class="big num">${d>0?'J-'+d:d===0?'GO':'✓'}</div>
      <div class="ev">${r.short}</div>
      <div class="meta">${fmtDateFr(r.date,{day:1})}${r.start?' · '+r.start:''} · ${r.km} km · ${fmtInt(r.dplus)} D+</div>
      <div class="meta">Prédiction ${r.prediction}</div></div>`};
  const pct = cur.pk? Math.min(100,cur.rk/cur.pk*100):0;

function renderCal(){
  const t0=today0();
  const months=[[2026,7],[2026,8],[2026,9],[2026,10]];
  const wkCache={};WEEKS.forEach(w=>wkCache[w.w]=getWeek(w.w));
  const raceDates = {};['monteynard','tdlm','drutel','utbv','saintelyon'].forEach(id=>raceDates[RACES[id].date]=RACES[id]);
  const actMap = actsByDate();
  let html=`<div class="card"><h2>Calendrier août → novembre 2026</h2>
    <div class="legend">${Object.keys(TYPES).map(k=>typeBadge(k)).join('')}</div>
    <div class="small muted" style="margin-top:8px">Totaux hebdo = planifié / réalisé, courses incluses. Clique un jour pour ouvrir sa semaine.</div></div>`;
  for(const [y,m] of months){
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    let d=addDays(first,-((first.getDay()+6)%7));
    html+=`<div class="card" style="margin-top:16px"><h2 style="text-transform:capitalize">${MONTHS[m]} ${y}</h2><div class="cal">
      ${DAYS.map(x=>`<div class="h">${x}</div>`).join('')}<div class="h">Semaine</div>`;
    while(d<=last){
      const wn=isoWeek(d);const wk=wkCache[wn];
      for(let i=0;i<7;i++){
        const day=addDays(d,i);const ds=ymd(day);const out=day.getMonth()!==m;
        const s=wk?wk.sessions[i]:null;const race=raceDates[ds];
        const runs=(actMap[ds]||[]).filter(a=>a.type==='Run');const rk=runs.reduce((a,b)=>a+b.km,0);
        let inner='';
        if(s && s.type!=='REPOS'){const T=TYPES[s.type];inner+=`<div class="tb" style="background:${T.color}1f;color:${shade(T.color)}" title="${esc(s.title)}">${T.label}${s.km?' '+fmtKm(s.km):''}</div>`}
        else if(s) inner+=`<div class="tb" style="background:#f3f4f6;color:#6b7280">Repos</div>`;
        else if(race) inner+=`<div class="tb" style="background:#FC4C021f;color:#d93f00">${race.short}</div>`;
        if(s&&s.type==='COURSE') inner+=`<div class="rk" style="color:var(--orange-d);font-weight:600">${esc(race?race.short:s.title)}</div>`;
        if(rk) inner+=`<div class="rk">✓ ${fmtKm(rk)} km</div>`;
        else if(s&&s.done&&s.type==='REPOS'&&!out) inner+=`<div class="rk">✓</div>`;
        html+=`<div class="cell ${out?'out':''} ${+day===+t0?'today':''} ${race?'race':''}" ${wk?`data-goplan="${wn}"`:''}><div class="dn"><span>${day.getDate()}</span>${rk?'<span style="color:var(--green)">●</span>':''}</div>${inner}</div>`;
      }
      html+= wk?`<div class="wtot" data-goplan="${wn}" style="cursor:pointer"><span class="muted">S${wn}</span><b class="num">${fmtKm(wk.pk)} / ${wk.status==='future'?'—':fmtKm(wk.rk)} km</b><span class="num muted">${fmtInt(wk.pd)} / ${wk.status==='future'?'—':fmtInt(wk.rd)} m</span></div>`
               :`<div class="wtot"><span class="muted">S${wn}</span><span class="muted">hors plan</span></div>`;
      d=addDays(d,7);
    }
    html+=`</div></div>`;
  }
  return html;
}

function streamPts(id){
  const s=STREAMS[id];const n=s.alt.length;
  return s.alt.map((a,i)=>({km:s.km*i/(n-1),alt:a,t:s.t[i],hr:s.hr[i]}));
}
function schemaPts(){
  const out=[];
  for(let k=0;k<UTBV_SCHEMA.length-1;k++){
    const [x0,y0]=UTBV_SCHEMA[k],[x1,y1]=UTBV_SCHEMA[k+1];
    const n=Math.max(2,Math.round((x1-x0)*6));
    for(let j=0;j<n;j++){const f=j/n;const e=(1-Math.cos(Math.PI*f))/2;out.push({km:x0+(x1-x0)*f,alt:y0+(y1-y0)*e})}
  }
  out.push({km:42.53,alt:450});return out;
}
function cumGain(pts){
  /* D+ / D- avec hystérésis 4 m pour filtrer le bruit */
  let up=0,down=0,ref=pts[0].alt;const cu=[0],cd=[0];
  for(let i=1;i<pts.length;i++){const d=pts[i].alt-ref;if(d>=4){up+=d;ref=pts[i].alt}else if(d<=-4){down-=d;ref=pts[i].alt}cu.push(up);cd.push(down)}
  return {up,down,cu,cd};
}
const RACE_LIST = [
  {id:'utbv',label:'UTBV 2026',kind:'goal'},
  {id:'saintelyon',label:'Sainté-Lyon',kind:'goal'},
  {id:'drutel',label:'Trail Drutel',kind:'done'},
  {id:'tdlm',label:'Trail de la Mine',kind:'done'},
  {id:'monteynard',label:'Monteynard',kind:'done'}
];
function raceProfile(id){
  const up=S.uploads[id];
  if(up) return {pts:up.pts.map(p=>({km:p[0],alt:p[1]})),src:'gpx',file:up.name};
  if(STREAMS[id]) return {pts:streamPts(id),src:'strava'};
  if(id==='utbv') return {pts:schemaPts(),src:'schema'};
  return null;
}
function sectionsFor(id,prof){
  const R=RACES[id];
  const total = prof? prof.pts[prof.pts.length-1].km : R.km;
  if(id==='utbv') return UTBV_SECTIONS.map(s=>({...s,to:Math.min(s.to,total)}));
  if(id==='drutel') return [{from:0,to:total/2,note:'Boucle 1'},{from:total/2,to:total,note:'Boucle 2'}];
  const out=[];for(let k=0;k<total-0.01;k+=5)out.push({from:k,to:Math.min(total,k+5)});return out;
}
function statsBetween(pts,g,a,b){
  let i0=pts.findIndex(p=>p.km>=a);if(i0<0)i0=pts.length-1;
  let i1=pts.findIndex(p=>p.km>=b-1e-6);if(i1<0)i1=pts.length-1;
  const up=g.cu[i1]-g.cu[i0],down=g.cd[i1]-g.cd[i0];
  let hr=0,n=0;for(let i=i0;i<=i1;i++)if(pts[i].hr){hr+=pts[i].hr;n++}
  const t = pts[i1].t!=null&&pts[i0].t!=null? pts[i1].t-pts[i0].t : null;
  return {up,down,hr:n?hr/n:null,t,a0:pts[i0].alt,a1:pts[i1].alt};
}

function profileSVG(pts,{sections=[],markers=[],height=240}={}){
  const W=760,H=height,pl=40,pr=10,pt=14,pb=26;
  const maxKm=pts[pts.length-1].km;
  const amin=Math.min(...pts.map(p=>p.alt)),amax=Math.max(...pts.map(p=>p.alt));
  const lo=Math.floor((amin-30)/50)*50, hi=Math.ceil((amax+30)/50)*50;
  const x=k=>pl+(W-pl-pr)*k/maxKm, y=a=>pt+(H-pt-pb)*(1-(a-lo)/(hi-lo));
  let d=`M${x(0)},${y(pts[0].alt)}`;pts.forEach(p=>d+=`L${x(p.km).toFixed(1)},${y(p.alt).toFixed(1)}`);
  const area=d+`L${x(maxKm)},${H-pb}L${x(0)},${H-pb}Z`;
  let g=`<defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FC4C02" stop-opacity=".35"/><stop offset="1" stop-color="#FC4C02" stop-opacity=".03"/></linearGradient></defs>`;
  const st=niceStep((hi-lo)/4);
  for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f2"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#9aa1ab">${v}</text>`;
  const ks=maxKm>30?5:maxKm>12?2:1;
  for(let k=0;k<=maxKm+1e-6;k+=ks)g+=`<text x="${x(k)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#9aa1ab">${k}</text>`;
  sections.forEach((s,i)=>{if(i%2)g+=`<rect x="${x(s.from)}" y="${pt}" width="${x(s.to)-x(s.from)}" height="${H-pt-pb}" fill="#f6f7f9"/>`});
  g+=`<path d="${area}" fill="url(#pg)"/><path d="${d}" fill="none" stroke="#FC4C02" stroke-width="2" stroke-linejoin="round"/>`;
  markers.forEach(m=>{if(m.km>maxKm)return;let p=pts.reduce((b,q)=>Math.abs(q.km-m.km)<Math.abs(b.km-m.km)?q:b,pts[0]);
    g+=`<line x1="${x(m.km)}" x2="${x(m.km)}" y1="${y(p.alt)}" y2="${pt+4}" stroke="#2563eb" stroke-dasharray="3 3"/><circle cx="${x(m.km)}" cy="${y(p.alt)}" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="${x(m.km)+4}" y="${pt+10}" font-size="10.5" font-weight="600" fill="#2563eb">${esc(m.label)}</text>`});
  g+=`<line id="pcx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#111827" stroke-width="1" opacity="0"/><circle id="pcd" r="5" fill="#fff" stroke="#FC4C02" stroke-width="2.5" opacity="0"/>`;
  g+=`<rect id="phit" x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent"/>`;
  return {svg:`<svg class="chart" id="prof" viewBox="0 0 ${W} ${H}">${g}</svg>`,x,y,W,pl,pr,maxKm};
}
function bindProfile(pts,geom,g){
  const svg=$('#prof');if(!svg)return;const hit=$('#phit');
  const move=(cx,cy)=>{
    const r=svg.getBoundingClientRect();const vx=(cx-r.left)/r.width*geom.W;
    const km=Math.max(0,Math.min(geom.maxKm,(vx-geom.pl)/(geom.W-geom.pl-geom.pr)*geom.maxKm));
    let bi=0;for(let i=1;i<pts.length;i++)if(Math.abs(pts[i].km-km)<Math.abs(pts[bi].km-km))bi=i;
    const p=pts[bi];
    $('#pcx').setAttribute('x1',geom.x(p.km));$('#pcx').setAttribute('x2',geom.x(p.km));$('#pcx').setAttribute('opacity',.25);
    $('#pcd').setAttribute('cx',geom.x(p.km));$('#pcd').setAttribute('cy',geom.y(p.alt));$('#pcd').setAttribute('opacity',1);
    showTip(`<b>km ${fmtKm(p.km,2)}</b> · ${Math.round(p.alt)} m<br>D+ cumulé ${fmtInt(g.cu[bi]*(g.scale||1))} m${p.hr?`<br>FC ${p.hr}`:''}${p.t!=null?`<br>Temps ${fmtDur(p.t,true)}`:''}`,cx,cy);
  };
  hit.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  hit.addEventListener('mouseleave',()=>{hideTip();$('#pcx').setAttribute('opacity',0);$('#pcd').setAttribute('opacity',0)});
  hit.addEventListener('touchmove',e=>{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
  hit.addEventListener('touchend',()=>setTimeout(hideTip,1200));
}
function cumSVG(pts,g,scale){
  const W=760,H=120,pl=40,pr=10,pt=8,pb=20;const maxKm=pts[pts.length-1].km;const top=Math.max(1,g.up*scale);
  const x=k=>pl+(W-pl-pr)*k/maxKm,y=v=>pt+(H-pt-pb)*(1-v/top);
  let d='';pts.forEach((p,i)=>d+=`${i?'L':'M'}${x(p.km).toFixed(1)},${y(g.cu[i]*scale).toFixed(1)}`);
  let gr='';const st=niceStep(top/3);for(let v=0;v<=top;v+=st)gr+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f2"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#9aa1ab">${fmtInt(v)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${gr}<path d="${d}" fill="none" stroke="#2563eb" stroke-width="2"/></svg>`;
}

const REFS = {
  tdlm:{label:'Trail de la Mine',km:28.45,dplus:1506,sec:13473},
  monteynard:{label:'Monteynard',km:39,dplus:2122,sec:20760},

function predict(km,dplus,ref='tdlm'){const r=REFS[ref];const ke=km+dplus/100,ke0=r.km+r.dplus/100;return r.sec*Math.pow(ke/ke0,1.06)}

/* Parseur GPX */
function parseGPX(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('Fichier GPX illisible');
  let nodes=[...doc.getElementsByTagName('trkpt')];if(!nodes.length)nodes=[...doc.getElementsByTagName('rtept')];
  if(nodes.length<2) throw new Error('Aucun point de trace trouvé');
  const raw=nodes.map(n=>{const e=n.getElementsByTagName('ele')[0];return {lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:e?+e.textContent:NaN}}).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  if(raw.every(p=>!isFinite(p.ele))) throw new Error('Le GPX ne contient pas d\'altitude');
  let km=0;const pts=[{km:0,alt:raw[0].ele}];
  const R=6371;const rad=x=>x*Math.PI/180;
  for(let i=1;i<raw.length;i++){const a=raw[i-1],b=raw[i];const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);
    const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;km+=2*R*Math.asin(Math.sqrt(h));
    pts.push({km,alt:isFinite(b.ele)?b.ele:pts[pts.length-1].alt})}
  /* lissage 5 points puis rééchantillonnage tous les 50 m */
  const sm=pts.map((p,i)=>{let s=0,n=0;for(let j=Math.max(0,i-2);j<=Math.min(pts.length-1,i+2);j++){s+=pts[j].alt;n++}return {km:p.km,alt:s/n}});
  const out=[];const step=Math.max(0.05,km/1200);let j=0;
  for(let k=0;k<=km;k+=step){while(j<sm.length-2&&sm[j+1].km<k)j++;const a=sm[j],b=sm[j+1]||a;const f=b.km>a.km?(k-a.km)/(b.km-a.km):0;out.push([+k.toFixed(3),+(a.alt+(b.alt-a.alt)*Math.max(0,Math.min(1,f))).toFixed(1)])}
  out.push([+km.toFixed(3),+sm[sm.length-1].alt.toFixed(1)]);
  return out;
}

      <div class="row"><button class="btn sm" data-race-go="monteynard">Voir le profil</button><a class="btn sm" href="https://www.strava.com/activities/${M.strava}" target="_blank" rel="noopener">Strava</a></div></div>
    <div class="card"><h2>Nutrition quotidienne<span class="r">${ATHLETE.weight} kg</span></h2>${kvTable(NUTRITION.daily)}<h3>Pré-course</h3>${kvTable(NUTRITION.pre)}</div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Profil athlète</h2>
    ${kvTable([['Poids',ATHLETE.weight+' kg'],['Lieu',ATHLETE.location],['Pied','Voûte haute · '+ATHLETE.pronation],['Pointure','Standard '+ATHLETE.shoe_size.standard+' · running '+ATHLETE.shoe_size.running+' · La Sportiva '+ATHLETE.shoe_size.la_sportiva],['Strava','ID '+ATHLETE.strava_id]])}
    <h3>Évolution matériel</h3><ul class="small" style="margin:0;padding-left:18px">${SHOE_NEXT.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
}
after.zones = ()=>{
  const upd=()=>{const t=predict(+$('#pkm').value||0,+$('#pdp').value||0,$('#pref').value);$('#pout').textContent='≈ '+fmtDur(t)};
  ['#pkm','#pdp','#pref'].forEach(s=>$(s).addEventListener('input',upd));upd();
};

/* =========================================================
   COACH IA (Claude API + MCP Strava)
   ========================================================= */
const MODEL='claude-opus-5-5';
const SDK_URL='https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const STRAVA_MCP='https://mcp.strava.com/mcp';
let sdkPromise=null;
function getClient(){
  const key=local.get('ct_api_key');
  if(!key) throw new Error('Ajoute ta clé API Anthropic dans les réglages du coach.');
  sdkPromise = sdkPromise || import(SDK_URL);
  return sdkPromise.then(m=>{const A=m.default||m.Anthropic;return new A({apiKey:key,dangerouslyAllowBrowser:true})});
}
function mcpParams(){
  const tok=local.get('ct_strava_token');
  if(!tok) return {betas:[],extra:{}};
  return {betas:['mcp-client-2025-11-20'],extra:{mcp_servers:[{type:'url',url:STRAVA_MCP,name:'strava',authorization_token:tok}],tools:[{type:'mcp_toolset',mcp_server_name:'strava'}]}};
}
function systemPrompt(){
  const cw=currentWeekNum();
  const weeks=WEEKS.map(w=>getWeek(w.w));
  const wkLines=weeks.map(w=>`S${w.w} (${ymd(w.start)}) ${w.phase} bloc ${w.block}: planifié ${fmtKm(w.pk)} km/${fmtInt(w.pd)} D+${w.status!=='future'?`, réalisé ${fmtKm(w.rk)} km/${fmtInt(w.rd)} D+`:''}${w.foot.length?`, ${w.foot.length} foot`:''}`).join('\n');
  const cur=getWeek(cw);
  const curLines=cur.sessions.map(s=>`${DAYS_L[s.i]} ${ymd(s.date)}: ${TYPES[s.type].label} "${s.title}" ${s.km} km/${s.dplus} D+, FC ${s.bpm}, allure ${s.pace}${s.note?`, note: ${s.note}`:''}${s.ak?` → réalisé ${fmtKm(s.ak)} km/${fmtInt(s.ad)} D+`:''}${s.done?' [fait]':''}`).join('\n');
  const shoes=shoeList().map(s=>`${s.name}: ${fmtInt(s.km)} km${s.cap?'/'+s.cap:''}, ${s.role}, ${SHOE_STATUS[s.status][0]}. ${s.note}`).join('\n');
  return `Tu es le coach trail running personnel de Noa Nardone. Tu réponds en français, de façon directe, concrète et chiffrée. Expertise : entraînement trail et ultra, physiologie de l'effort, nutrition sportive, stratégie de course, préparation mentale, prévention des blessures et matériel.

Date du jour : ${ymd(today0())} (semaine S${cw}).

PROFIL
- 77 kg, Lissieu (Rhône). FC max 192. 5 km estimé 20:13. Voûte plantaire haute, pronateur probable. Pointure 42.5 (Saucony/Brooks 44, La Sportiva 45).
- Zones FC : Z1 0-128, Z2 129-160, Z3 161-175, Z4 176-191, Z5 192+.
- Allures : EF 5:39-6:30 (128-155 bpm), AS21 4:52-5:10 (155-170), AS10 4:30-4:52 (170-180), AS5 4:05-4:22 (180-190), VMA 3:40-3:55 (190+).

COURSES DE RÉFÉRENCE
- Monteynard 16/08/2026 : 39 km, 2122 D+, 5h46, FC 153/175. Pacing excellent, départ prudent, nouvelle référence.
- Paladru : 55 km, 2000 D+, 7h20. Départ trop ambitieux, explosion musculaire km 30. Leçon : ne plus partir trop vite.
- Trail de la Mine 19/09/2026 : 28,45 km, 1506 D+, 3h44:33, FC 149/170, couru en contrôle, finish rapide (km 27 4:59). Meilleur indicateur de forme.
- Trail Drutel 27/09/2026 : 19,17 km, 398 D+, 1h34:07 (4:55/km), FC 159/172. Objectif 1h40 battu.

OBJECTIFS
- UTBV 10/10/2026, Cublize : 42,53 km, 2173 D+/D-, alt 317-827, boucle. Prédiction 5h10-5h25. Nutrition : 4 gels (km 10, 17, 23, 28 caféiné) + flasque 500 ml isotonique, 50-60 g glucides/h, sodium 500-700 mg/h.
  Tronçons : ${UTBV_SECTIONS.map(s=>`${s.from}-${s.to} km +${s.up}/-${s.down} allure ${s.pace} : ${s.note}`).join(' | ')}
  Attention : ces allures totalisent ~5h49, au-dessus de la prédiction.
- Sainté-Lyon 28/11/2026, départ 23h30 : ~80 km, ~2200 D+, nocturne, mixte sentier/bitume. Prédiction 10h30-12h00. Premier ultra. Nutrition : 500-700 g glucides, gels + isotonique 5 premières heures puis solide tiède (soupe, riz, fromage, coca), bouillons chauds.

NUTRITION QUOTIDIENNE : 2800-3200 kcal en charge, 2400-2600 en affûtage. 55/25/20. Glucides 5-7 g/kg, protéines 1,6-1,8 g/kg. Post-SL 1,2 g/kg glucides + 0,3 g/kg protéines en 30 min. J-3 : 8-10 g/kg glucides, moins de fibres, 2-3 L eau salée.

PLAN (volumes course à pied ; le foot est compté à part)
${wkLines}

SEMAINE EN COURS S${cw}
${curLines}

CHAUSSURES
${shoes}

RÈGLES
- Base tes réponses sur ces données. Si l'outil Strava est disponible, utilise-le pour les données récentes (activités, streams, zones, matériel) avant de conclure.
- Donne des consignes actionnables : séance, durée, allure, FC, nutrition.
- Signale tout risque de blessure ou de surcharge. Pour une douleur persistante, recommande un professionnel de santé.`;
}
function renderCoach(){
  const hasKey=!!local.get('ct_api_key'),hasTok=!!local.get('ct_strava_token');
  const quick=['Analyse ma semaine en cours','Ma stratégie UTBV tronçon par tronçon','Plan nutrition J-3 à J0 pour l\'UTBV','Quelle séance demain ?','Compare mes 3 dernières sorties longues','Que changer pour la Sainté-Lyon ?'];
  return `<div class="grid g3">
    <div class="card span2 chat">
      <h2>Coach IA<span class="r">${MODEL}${hasTok?' · Strava MCP':''}</span></h2>
      <div class="msgs" id="msgs">${S.chat.length?S.chat.map(msgHTML).join(''):`<div class="empty">Pose une question sur ton entraînement, l'UTBV, la nutrition ou le matériel.<br>Le coach connaît ton plan, tes zones, tes courses et tes chaussures.</div>`}</div>
      <div class="chips" style="margin-bottom:8px">${quick.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form class="compose" id="compose"><textarea id="cin" placeholder="${hasKey?'Écris au coach…':'Ajoute ta clé API dans les réglages'}" rows="1"></textarea><button class="btn pri" id="csend" ${S.chatBusy?'disabled':''}>Envoyer</button></form>
    </div>
    <div class="card">
      <h2>Réglages</h2>
      <div class="field"><label>Clé API Anthropic</label><input type="password" id="kapi" value="${hasKey?'••••••••':''}" placeholder="sk-ant-…" autocomplete="off"></div>
      <div class="field"><label>Token OAuth Strava MCP <span class="muted">(facultatif)</span></label><input type="password" id="kstr" value="${hasTok?'••••••••':''}" placeholder="Bearer token pour ${STRAVA_MCP}" autocomplete="off"></div>
      <div class="row"><button class="btn pri sm" data-act="savekeys">Enregistrer</button><button class="btn sm" data-act="clearkeys">Effacer</button><button class="btn sm" data-act="clearchat">Vider le chat</button></div>
      <div class="info small" style="margin-top:12px">Les clés restent dans ce navigateur (localStorage) et partent uniquement vers api.anthropic.com. Avec le token Strava, le coach lit tes activités en direct via le connecteur MCP et le bouton Synchro met à jour le tableau de bord.</div>
      <div class="small muted" style="margin-top:10px">Repli automatique sur un autre modèle si la requête est refusée (server-side fallback).</div>
    </div>
  </div>`;
}
function mdLite(s){
  return esc(s).replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^- /gm,'• ');
}
function msgText(m){if(typeof m.content==='string')return m.content;return (m.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')}
function msgHTML(m){
  if(m.role==='user') return `<div class="msg u">${esc(msgText(m))}</div>`;
  if(m.role==='error') return `<div class="msg a err">${esc(m.text)}</div>`;
  const tools=(m.content||[]).filter(b=>b.type==='mcp_tool_use').map(b=>`<span class="pill o">Strava · ${esc(b.name)}</span>`).join('');
  return `<div class="msg a">${tools?`<div class="tools">${tools}</div>`:''}${mdLite(msgText(m))}</div>`;
}
after.coach = ()=>{
  const box=$('#msgs');box.scrollTop=box.scrollHeight;
  const ta=$('#cin');
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#compose').requestSubmit()}});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(160,ta.scrollHeight)+'px'});
  $('#compose').addEventListener('submit',e=>{e.preventDefault();const v=ta.value.trim();if(v&&!S.chatBusy){ta.value='';sendChat(v)}});
};
function apiHistory(){
  /* N'envoie que les tours user/assistant, contenu assistant renvoyé tel quel */
  const h=S.chat.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content}));
  while(h.length&&h[0].role!=='user')h.shift();
  return h;
}
async function sendChat(text){
  S.chat.push({role:'user',content:text});S.chatBusy=true;
  if(S.tab==='coach')render();
  const box=()=>$('#msgs');
  const live=document.createElement('div');live.className='msg a';live.innerHTML='<span class="muted">Le coach réfléchit…</span>';
  box()&&box().appendChild(live);box()&&(box().scrollTop=box().scrollHeight);
  try{
    const client=await getClient();const mp=mcpParams();
    const stream=client.beta.messages.stream({
      model:MODEL,max_tokens:16000,system:systemPrompt(),messages:apiHistory(),
      output_config:{effort:'medium'},
      betas:[...mp.betas,'server-side-fallback-2026-07-01'],fallbacks:'default',
      ...mp.extra
    });
    let txt='',tools=[];
    stream.on('streamEvent',ev=>{if(ev.type==='content_block_start'&&ev.content_block&&ev.content_block.type==='mcp_tool_use'){tools.push(ev.content_block.name);paint()}});
    stream.on('text',d=>{txt+=d;paint()});
    function paint(){live.innerHTML=(tools.length?`<div class="tools">${tools.map(t=>`<span class="pill o">Strava · ${esc(t)}</span>`).join('')}</div>`:'')+(txt?mdLite(txt):'<span class="muted">Lecture Strava…</span>');const b=box();if(b)b.scrollTop=b.scrollHeight}
    const final=await stream.finalMessage();
    if(final.stop_reason==='refusal'){S.chat.pop();S.chat.push({role:'error',text:'Requête refusée par le modèle. Reformule la question.'})}
    else S.chat.push({role:'assistant',content:final.content});
  }catch(e){
    S.chat.pop();
    S.chat.push({role:'error',text:'Erreur : '+(e&&e.message?e.message:String(e))});
  }
  S.chatBusy=false;save();if(S.tab==='coach')render();
}

/* Synchro Strava via Claude + MCP */
async function syncStrava(){
  if(!local.get('ct_api_key')||!local.get('ct_strava_token')){
    alert('Synchro live : renseigne la clé API Anthropic et le token Strava MCP dans l\'onglet Coach IA. En attendant, le tableau de bord utilise le snapshot Strava du '+fmtDateFr(SNAPSHOT_DATE)+'.');
    go('coach');return;
  }
  const btn=$('[data-act=sync]');if(btn){btn.disabled=true;btn.textContent='Synchro…'}
  try{
    const client=await getClient();const mp=mcpParams();
    const prompt=`Appelle l'outil Strava list_activities avec range_start "2026-08-24T00:00:00", first 100, ordering StartDateLocalAsc. Puis appelle get_gear avec gear_types ["Shoe"].
Réponds UNIQUEMENT avec un objet JSON, sans texte autour :
{"activities":[[id,"YYYY-MM-DD","HH:MM",nom,sport_type,distance_km_2_decimales,elevation_gain_m,moving_time_s,gear_id_ou_vide,relative_effort_ou_0]],"gear":[[gear_id,total_distance_km_1_decimale]]}
Pour sport_type : "Run", "Ride", ou "Foot" si l'activité s'appelle "Foot". Toutes les activités, sans exception.`;
    const msg=await client.beta.messages.create({model:MODEL,max_tokens:16000,messages:[{role:'user',content:prompt}],output_config:{effort:'low'},betas:[...mp.betas,'server-side-fallback-2026-07-01'],fallbacks:'default',...mp.extra});
    if(msg.stop_reason==='refusal') throw new Error('requête refusée');
    const txt=msg.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    if(!Array.isArray(j.activities)||!j.activities.length) throw new Error('aucune activité reçue');
    S.activities=j.activities.map(a=>[String(a[0]),a[1],a[2],a[3],a[4],+a[5],+a[6],+a[7],String(a[8]||''),+a[9]||0]);
    S.shoesKm={};(j.gear||[]).forEach(g=>S.shoesKm[String(g[0])]=+g[1]);
    S.syncedAt=Date.now();S.syncSource='live';save();renderSync();render();
  }catch(e){alert('Synchro impossible : '+(e.message||e));if(btn){btn.disabled=false;btn.textContent='Synchro'}}
}

/* =========================================================
   ÉVÉNEMENTS GLOBAUX
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-week],[data-goplan],[data-done],[data-act],[data-race],[data-race-go],[data-mv],[data-q]');
  if(!t)return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.week){S.planWeek=+t.dataset.week;return render()}
  if(t.dataset.goplan){S.planWeek=+t.dataset.goplan;return go('plan')}
  if(t.dataset.race){S.raceId=t.dataset.race;return render()}
  if(t.dataset.raceGo){S.raceId=t.dataset.raceGo;return go('gpx')}
  if(t.dataset.q){if(!S.chatBusy)sendChat(t.dataset.q);return}
  if(t.dataset.mv){const [i,d]=t.dataset.mv.split(':').map(Number);return swapSessions(S.planWeek,i,i+d)}
  if(t.dataset.done){const [w,i]=t.dataset.done.split(':').map(Number);const wk=getWeek(w);const s=wk.sessions[i];const E=ensureEdit(w);
    E.days[i]=E.days[i]||{};E.days[i].done=!s.done;save();return render()}
  const a=t.dataset.act;
  if(a==='edit'){S.editMode=!S.editMode;return render()}
  if(a==='resetweek'){if(confirm(`Réinitialiser S${S.planWeek} ? Les modifications de cette semaine seront perdues.`)){delete S.edits[S.planWeek];save();render()}return}
  if(a==='sync') return syncStrava();
  if(a==='gpx') return $('#gpxIn').click();
  if(a==='rmgpx'){delete S.uploads[S.raceId];save();return render()}
  if(a==='savekeys'){const k=$('#kapi').value.trim(),s=$('#kstr').value.trim();if(k&&!k.startsWith('••'))local.set('ct_api_key',k);if(s&&!s.startsWith('••'))local.set('ct_strava_token',s);if(!s)local.set('ct_strava_token','');sdkPromise=null;return render()}
  if(a==='clearkeys'){local.set('ct_api_key','');local.set('ct_strava_token','');return render()}
  if(a==='clearchat'){S.chat=[];save();return render()}
});
$('#gpxIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const pts=parseGPX(await f.text());S.uploads[S.raceId]={name:f.name,pts};save();render()}
  catch(err){alert('GPX : '+err.message)}
});
document.addEventListener('dragover',e=>{if(S.tab==='gpx'&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',async e=>{
  if(S.tab!=='gpx'||!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();
  const f=e.dataTransfer.files[0];
  try{const pts=parseGPX(await f.text());S.uploads[S.raceId]={name:f.name,pts};save();render()}catch(err){alert('GPX : '+err.message)}
});

(async function init(){
  await loadState();
  renderTabs();renderSync();render();
})();
</script>
